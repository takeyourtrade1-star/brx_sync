# BRX-Sync Production Compose
# NO env_file — tutte le variabili arrivano dal processo host (start_brx_sync.sh)
# Segreti da AWS SSM Parameter Store, mai scritti su disco.
services:
  brx-sync-api:
    image: 000876600482.dkr.ecr.eu-south-1.amazonaws.com/ebartex-sync:latest
    container_name: brx-sync-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL
      - MYSQL_HOST
      - MYSQL_PORT
      - MYSQL_USER
      - MYSQL_PASSWORD
      - MYSQL_DATABASE
      - REDIS_URL
      - FERNET_KEY
      - JWT_PUBLIC_KEY
      - WEBHOOK_PUBLIC_URL
      - AWS_REGION
      - ENVIRONMENT
      - DEBUG
      - AWS_SSM_ENABLED
      - ALLOWED_ORIGINS
    depends_on:
      brx-sync-redis:
        condition: service_healthy
    networks:
      - brx-sync-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  brx-sync-worker:
    image: 000876600482.dkr.ecr.eu-south-1.amazonaws.com/ebartex-sync:latest
    container_name: brx-sync-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker -B --loglevel=info --queues=high-priority,bulk-sync,default --concurrency=4
    environment:
      - DATABASE_URL
      - MYSQL_HOST
      - MYSQL_PORT
      - MYSQL_USER
      - MYSQL_PASSWORD
      - MYSQL_DATABASE
      - REDIS_URL
      - FERNET_KEY
      - JWT_PUBLIC_KEY
      - WEBHOOK_PUBLIC_URL
      - AWS_REGION
      - ENVIRONMENT
      - DEBUG
      - AWS_SSM_ENABLED
    depends_on:
      brx-sync-redis:
        condition: service_healthy
    networks:
      - brx-sync-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  brx-sync-redis:
    image: redis:7-alpine
    container_name: brx-sync-redis
    restart: unless-stopped
    # Redis listen on 6381 on host to avoid conflict with other services
    ports:
      - "6381:6379"
    # Persistenza: i contatori del reconciler e il dedup webhook devono
    # sopravvivere ai redeploy
    command: redis-server --appendonly yes
    volumes:
      - brx-sync-redis-data:/data
    networks:
      - brx-sync-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

networks:
  brx-sync-net:
    driver: bridge
    name: brx-sync-net

volumes:
  brx-sync-redis-data:
